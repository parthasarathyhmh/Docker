server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  #################################################
  # Application Logs
  #################################################
  - job_name: app

    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          __path__: /logs/app.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            module: module
            message: message

      - labels:
          level:
          module:

  #################################################
  # Login Logs
  #################################################
  - job_name: login

    static_configs:
      - targets:
          - localhost
        labels:
          job: login
          __path__: /logs/login.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message

      - json:
          expressions:
            event: event
            username: username
            userId: userId
          source: message

      - labels:
          level:
          event:
