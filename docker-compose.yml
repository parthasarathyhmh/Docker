services:
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs

    ports:
      - "3000:3000"

    volumes:
      - ./logs:/app/logs  #copy ./logs from host machine <--to--> container's  /app/logs

    depends_on:
      - loki

  mongo:
    image: mongo:8
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  loki:
    image: grafana/loki:3.7.0
    container_name: loki

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/loki-config.yaml  #The command instruction tells Docker what command to run when the container starts.

    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail

    command: -config.file=/etc/promtail/promtail-config.yaml

    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - ./logs:/logs

    depends_on:
      - loki
      - nestjs

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana

    ports:
      - "3001:3000"

    depends_on:
      - loki
      
volumes:
  mongo-data: #If you stop or remove the MongoDB container the data inside mongo-data is not deleted