services:
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs
    ports:
      - "3000:3000" # Host_Port : Container_Port => when you open: http://localhost:3000, Docker forwards the request to: Container Port 3000. Reason: Because your application is running inside the container, not on your host machine.

    # Bind Mount Volume
    volumes:
      - ./logs:/app/logs  # Mount the host's ./logs directory to the container's /app/logs. We are not including it in DockerImage, as it wil be lost if the container is removed or recreated, and need to rebuild image for every new entry
      
    depends_on:
      - loki

  mongo:
    image: mongo:8  # image should be in local system or download image from docker hub
    container_name: mongo
    ports:
      - "27017:27017"

    # Named Volume: Persist application data (like databases) in Docker-managed storage, independent of the container's lifecycle(create/delete).
    volumes:
      - mongo-data:/data/db # MongoDB container stores database files in '/data/db', which can be lost after deleting of container. So, instead store it in a Docker-managed volume named 'mongo-data'.

  redis:
    image: redis:8-alpine  # image should be in local system or download image from docker hub
    container_name: redis

    ports:
      - "6379:6379"

  loki:
    image: grafana/loki:3.7.0  ## image should be in local system or download image from docker hub
    container_name: loki

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/loki-config.yaml  # Tells Loki which configuration file to read.

    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml # Makes local ./loki-config.yaml available in container  ───────────────► at /etc/loki/loki-config.yaml.

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail

    command: -config.file=/etc/promtail/promtail-config.yaml

    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - ./logs:/logs

    depends_on:
      - loki
      - nestjs

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana

    ports:
      - "3001:3000" # When you open: http://localhost:3001, Docker forwards the request to: Container Port 3000

    depends_on:
      - loki
      
volumes:
  mongo-data: # Creates the Docker Volume to store the MongoDB data.
